<body>

    <div class="container">

        <div id="detail-view" class="d-none">
    <button class="btn btn-sm btn-link text-secondary mb-3" onclick="showMainView()"><i class="bi bi-arrow-left"></i> Back to List</button>
    
    <div class="glass-card p-4 mb-4">

</div>

    <div class="glass-card p-4">
        <h5 class="mb-3"><i class="bi bi-clock-history me-2"></i>Order & Transaction History</h5>

                <thead>
    <tr>
        <th>Date</th>
        <th>Item / Description</th>
        <th>Qty (Bags)</th>

</thead>

    <script>
    let currentSuppliers = [];

    async function loadSuppliers() {
        try {
            const response = await fetch('/view-suppliers');
            if (!response.ok) throw new Error("Failed to fetch");
            
            currentSuppliers = await response.json();
            const tbody = document.getElementById('supplier-table-body');
            let total = 0;
            tbody.innerHTML = '';

            currentSuppliers.forEach(s => {
                // We use || 0 to prevent "NaN" errors if the field is empty
                const debt = s.balanceDebt || 0;
                total += debt;
                
                tbody.innerHTML += `
                    <tr>
                        <td><a class="supplier-link fw-bold" onclick="viewDetails(${s.id})">${s.name}</a></td>
                        <td class="text-danger fw-bold">₹${debt.toLocaleString()}</td>
                        <td>
                        <button type="button" class="btn btn-sm text-warning" onclick="editSupplier(${s.id})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button type="button" class="btn btn-sm text-danger" onclick="deleteSupplier(${s.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                    </tr>`;
            });
            document.getElementById('total-owed-badge').innerText = `Total Owed: ₹${total.toLocaleString()}`;
        } catch (err) {
            console.error("Error loading suppliers:", err);
        }
    }
    
    function showMainView() {
        document.getElementById('main-view').classList.remove('d-none');
        document.getElementById('detail-view').classList.add('d-none');
        loadSuppliers(); // Refresh the main table
    }
    
    function viewDetails(id) {
        selectedSup = currentSuppliers.find(x => x.id === id);
        if(!selectedSup) return;

        document.getElementById('main-view').classList.add('d-none');
        document.getElementById('detail-view').classList.remove('d-none');

        // Fill UI - Using || to show "Not Provided" if the field is empty
        document.getElementById('det-name').innerText = selectedSup.name;
        document.getElementById('det-phone').innerText = selectedSup.phone || "No phone added";
        document.getElementById('det-address').innerText = selectedSup.address || "No address added";
        document.getElementById('det-balance').innerText = `₹${(selectedSup.balanceDebt || 0).toLocaleString()}`;
        
        loadPurchaseHistory(id); 
    }
    
    let allInventory = [];

 // Load products so dad can pick which rice arrived
// 1. The Delete Function
async function deleteSupplier(id) {
    console.log("Attempting to delete ID:", id);
    if (confirm("Are you sure you want to delete this supplier?")) {
        const res = await fetch(`/delete-supplier/${id}`, { method: 'DELETE' });
        if (res.ok) {
            console.log("Delete successful");
            loadSuppliers();
        } else {
            alert("Delete failed on server.");
        }
    }
}

// 2. The Edit Function
function editSupplier(id) {
    console.log("Opening Edit for ID:", id);
    const s = currentSuppliers.find(x => x.id === id);
    if (!s) return;

    document.getElementById('supId').value = s.id;
    document.getElementById('supName').value = s.name;
    document.getElementById('supPhone').value = s.phone;
    document.getElementById('supAddress').value = s.address;
    
    document.getElementById('form-title').innerText = "Edit Supplier Details";
    document.getElementById('save-btn').innerText = "Update Supplier";
    document.getElementById('cancel-btn').classList.remove('d-none');
}

// 3. The Supply Modal Trigger
// Function to filter products as Appa types
function filterRiceSearch() {
    const query = document.getElementById('riceSearchInput').value.toLowerCase();
    const resultsDiv = document.getElementById('riceSearchResults');
    
    if (query.length < 1) {
        resultsDiv.style.display = 'none';
        return;
    }

    // Filter from the allInventory array we load in openSupplyModal
    const filtered = allInventory.filter(p => 
        p.brand.toLowerCase().includes(query) || 
        p.name.toLowerCase().includes(query)
    );

    if (filtered.length > 0) {
        resultsDiv.innerHTML = filtered.map(p => `
            <button type="button" class="list-group-item list-group-item-action bg-dark text-white border-secondary" 
                onclick="selectRiceForSupply(${p.id}, '${p.brand} - ${p.name} (${p.bagWeight}kg)')">
                <div class="fw-bold text-info">${p.brand}</div>
                <small class="text-muted">${p.name} (${p.bagWeight}kg)</small>
            </button>
        `).join('');
        resultsDiv.style.display = 'block';
    } else {
        resultsDiv.innerHTML = '<div class="list-group-item bg-dark text-muted">No rice found with that name.</div>';
        resultsDiv.style.display = 'block';
    }
}

// Function to handle clicking a result
function selectRiceForSupply(id, displayName) {
    document.getElementById('purchaseProductId').value = id;
    document.getElementById('riceSearchInput').value = displayName;
    document.getElementById('riceSearchResults').style.display = 'none';
}

// Close the search list if user clicks away
document.addEventListener('click', function(e) {
    const searchInput = document.getElementById('riceSearchInput');
    const resultsDiv = document.getElementById('riceSearchResults');
    if (searchInput && !searchInput.contains(e.target)) {
        resultsDiv.style.display = 'none';
    }
});

async function openSupplyModal() {
    document.getElementById('modalSupName').innerText = selectedSup.name;
    
    // Reset the search fields
    document.getElementById('riceSearchInput').value = '';
    document.getElementById('purchaseProductId').value = '';

    // Load inventory once so the search is instant
    try {
        const res = await fetch('/view-products');
        allInventory = await res.json();
        
        const myModal = new bootstrap.Modal(document.getElementById('supplyModal'));
        myModal.show();
    } catch (err) {
        alert("Error loading inventory for search.");
    }
}

function downloadSupplierLedger() {
    const name = document.getElementById('det-name').innerText;
    const body = document.getElementById('history-body');
    const rows = body.querySelectorAll('tr');

    if (rows.length === 0) return alert("No transactions to download!");

    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Date,Description,Qty,Amount (INR)\r\n";

    rows.forEach(row => {
        const cols = row.querySelectorAll('td');
        const date = cols[0].innerText;
        const desc = cols[1].innerText;
        const qty = cols[2].innerText;
        // Clean the amount: remove ₹ and commas, keep the sign (+/-)
        const amt = cols[3].innerText.replace(/[₹,]/g, '').trim();

        csvContent += `${date},"${desc}",${qty},${amt}\r\n`;
    });

    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `${name}_Ledger_${new Date().toISOString().split('T')[0]}.csv`);
    document.body.appendChild(link);
    link.click();
}


async function deleteHistoryRecord(recordId) {
    if (confirm("⚠️ Delete this record? This will NOT automatically reverse the supplier's balance. You must manually adjust the balance if needed.")) {
        // Note: You may need to add a @DeleteMapping in StoreController for PurchaseRecord
        const res = await fetch(`/delete-purchase-record/${recordId}`, { method: 'DELETE' });
        if (res.ok) {
            alert("Record deleted.");
            viewDetails(selectedSup.id); // Refresh history
        }
    }
}

 async function submitPurchase() {
     const productId = document.getElementById('purchaseProductId').value;
     const bags = parseInt(document.getElementById('purchaseBags').value);
     const buyingPrice = parseFloat(document.getElementById('purchasePrice').value);
     
     if(!productId || !bags || !buyingPrice) return alert("Please fill all fields!");

     // Find the product details to calculate total weight
     const product = allInventory.find(p => p.id == productId);
     const totalWeight = bags * product.bagWeight;
     const totalCost = bags * buyingPrice;

     const purchaseData = {
         productId: productId,
         supplierId: selectedSup.id,
         addedQty: totalWeight,
         cost: totalCost,
         buyingPrice: buyingPrice
     };

     const response = await fetch('/log-purchase-order', {
         method: 'POST',
         headers: {'Content-Type': 'application/json'},
         body: JSON.stringify(purchaseData)
     });

     if(response.ok) {
         alert("Stock updated and debt added!");
         location.reload();
     }
 }

    async function addSupplier() {
        const idField = document.getElementById('supId').value;
        const supplier = {
            name: document.getElementById('supName').value,
            phone: document.getElementById('supPhone').value,
            address: document.getElementById('supAddress').value
        };

        if(!supplier.name) return alert("Please enter a Business Name");

        // Logic: If ID exists, Edit. If not, Add.
        const url = idField ? `/edit-supplier/${idField}` : '/add-supplier';
        
        try {
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(supplier)
            });

            if(response.ok) {
                resetForm();
                loadSuppliers();
            }
        } catch (err) {
            alert("Error saving supplier. Check Java Console.");
        }
    }

    function resetForm() {
        document.getElementById('supId').value = '';
        document.getElementById('supName').value = '';
        document.getElementById('supPhone').value = '';
        document.getElementById('supAddress').value = '';
        document.getElementById('form-title').innerText = "Register New Supplier";
        document.getElementById('save-btn').innerText = "Add Supplier";
    }
    
    async function payPrompt() {
        const amount = prompt(`How much are you paying to ${selectedSup.name}?`);
        if (!amount || isNaN(amount)) return;

        try {
            const response = await fetch(`/pay-supplier/${selectedSup.id}/${amount}`, {
                method: 'POST'
            });

            if (response.ok) {
                alert("Payment Recorded!");
                // Update the UI immediately
                selectedSup.balanceDebt -= parseFloat(amount);
                document.getElementById('det-balance').innerText = `₹${selectedSup.balanceDebt.toLocaleString()}`;
            }
        } catch (err) {
            alert("Error recording payment.");
        }
    }
    
    function toggleSupplyType(isNew) {
        document.getElementById('formExisting').classList.toggle('d-none', isNew);
        document.getElementById('formNew').classList.toggle('d-none', !isNew);
    }


    async function submitSupply() {
        const isNew = document.getElementById('typeNew').checked;
        const bags = parseInt(document.getElementById('purchaseBags').value);
        const costPerBag = parseFloat(document.getElementById('purchaseCostPrice').value);
        
        if(!bags || !costPerBag) return alert("Enter quantity and purchase price!");

        let supplyData = {
            supplierId: selectedSup.id,
            bags: bags,
            totalCost: bags * costPerBag,
            buyingPrice: costPerBag,
            isNewProduct: isNew
        };

        if(isNew) {
            supplyData.brand = document.getElementById('newBrand').value;
            supplyData.variety = document.getElementById('newName').value;
            supplyData.retailPrice = document.getElementById('newPrice').value;
            supplyData.wholesalePrice = document.getElementById('newBagPrice').value;
            supplyData.weight = document.getElementById('newBagWeight').value;
            supplyData.minStock = document.getElementById('newMinStock').value;
        } else {
            supplyData.productId = document.getElementById('purchaseProductId').value;
        }

        const res = await fetch('/log-purchase-order', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(supplyData)
        });

        if(res.ok) {
            alert("Stock & Debt Updated!");
            location.reload();
        }
    }
    
    
    
    
    async function loadPurchaseHistory(supplierId) {
        const historyBody = document.getElementById('history-body');
        
        try {
            const response = await fetch(`/supplier-history/${supplierId}`);
            if (!response.ok) throw new Error("Backend not responding");
            
            const history = await response.json();
            console.log("History Data Received:", history); // Check F12 console for this!

            if (history.length === 0) {
                historyBody.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No purchase history found.</td></tr>';
                return;
            }

            historyBody.innerHTML = history.map(h => {
                // Check BOTH the type and the name to be 100% sure
                const isPayment = h.transactionType === 'PAYMENT' || h.itemName.includes('PAYMENT');
                
                // Set variables based on type
                const rowClass = isPayment ? 'text-success' : ''; // Success is Green in Bootstrap
                const symbol = isPayment ? '-' : '+';
                const colorClass = isPayment ? 'text-success' : 'text-danger';

             // Inside your loadPurchaseHistory function...
                return `
                    <tr class="${rowClass}">
                        <td>${new Date(h.date).toLocaleDateString('en-IN')}</td>
                        <td class="fw-bold">${h.itemName}</td>
                        <td>${isPayment ? '-' : h.bags + ' Bags'}</td>
                        <td class="fw-bold ${colorClass}">
                            ${symbol} ₹${(h.cost || 0).toLocaleString()}
                        </td>
                        <td class="text-end">
                            <i class="bi bi-trash text-muted" style="cursor:pointer" onclick="deleteHistoryRecord(${h.id})"></i>
                        </td>
                    </tr>
                `;
            }).join('');

        } catch (err) {
            console.error("History Error:", err);
            historyBody.innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error loading history rows.</td></tr>';
        }
    }

    // Call on load
    window.onload = loadSuppliers;
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
