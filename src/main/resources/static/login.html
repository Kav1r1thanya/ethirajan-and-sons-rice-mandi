<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NomNom Pro | Terminal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-deep: #0f172a;
            --accent-blue: #3b82f6;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }

        /* SaaS Glassmorphism Card */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .brand-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
        }

        .form-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 1);
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
            color: white;
        }

        .btn-login {
            background: var(--accent-blue);
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-top: 1rem;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-login:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .erp-footer {
            position: absolute;
            bottom: 20px;
            font-size: 0.7rem;
            color: #475569;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center">
            <div class="brand-logo">
                <i class="bi bi-box-seam-fill text-white fs-2"></i>
            </div>
            <h4 class="fw-bold mb-1">TERMINAL ACCESS</h4>
            <p class="text-muted small mb-4">Ethirajan & Sons Rice Mandi</p>
        </div>

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="off">
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••">
        </div>

        <button class="btn btn-primary btn-login w-100" onclick="performLogin()">
            SIGN IN TO ERP
        </button>
    </div>

    <div class="erp-footer">
        POWERED BY NOMNOM ECOSYSTEM v2.6 • KOLATHUR TERMINAL
    </div>

    <script>
        async function performLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (!user || !pass) return alert("Please fill in all fields.");

            try {
                const res = await fetch('http://localhost:8081/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: user, password: pass })
                });

                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('userRole', data.role);
                    localStorage.setItem('userName', data.name);
                    window.location.href = 'index.html';
                } else {
                    alert("Invalid Credentials. Please try again.");
                }
            } catch (err) {
                alert("Server Connection Error. Ensure Backend is running.");
            }
        }
        
        // Allow "Enter" key to trigger login
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performLogin();
        });
    </script>
</body>
</html>
