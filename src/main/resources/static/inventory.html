    <script>
 // 1. Declare this at the VERY TOP of your <script> tag
    let allProducts = []; 

    async function loadInventory() {
        try {
            const response = await fetch('/view-products');
            allProducts = await response.json(); 
            
            // 1. Run the Dashboard first
            renderLowStockDashboard(allProducts);
            
            // 2. Run the normal inventory view
            renderInventory(allProducts);
            
        } catch (err) { 
            console.error("Dashboard Error:", err);
        }
    }

    // Keep your renderInventory and other functions as they are below!
        
     // 1. ADD NEW PRODUCT
        async function addNewProduct() {
    const product = {
        brand: document.getElementById('newBrand').value,
        name: document.getElementById('newName').value,
        price: parseFloat(document.getElementById('newPrice').value),
        bagPrice: parseFloat(document.getElementById('newBagPrice').value),
        bagWeight: parseInt(document.getElementById('newBagWeight').value),
        quantity: parseFloat(document.getElementById('newQty').value),
        minStockBags: parseInt(document.getElementById('newMinStock').value)
    };

    // Quick validation for your dad
    if(!product.brand || !product.name || isNaN(product.price)) {
        return alert("Please fill Brand, Variety, and Price!");
    }

    const response = await fetch('/add-product', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(product)
    });

    if(response.ok) {
        alert("Product added to inventory!");
        location.reload(); 
    } else {
        alert("Error saving product. Check if database columns exist.");
    }
}

        // 2. RENDER TABLE WITH COMBINED NAME
        let currentView = 'all'; // can be 'all' or a variety name like 'Basmati Rice'

        function renderInventory(products) {
            const tbody = document.getElementById('inventory-table-body');
            const thead = document.getElementById('inventory-thead');
            const header = document.getElementById('inventory-header');
            tbody.innerHTML = '';

            if (currentView === 'all') {
                // VIEW 1: List of Varieties (Unchanged)
                header.innerHTML = '<h5 class="text-muted">Select a variety to manage brands</h5>';
                thead.innerHTML = `<tr><th>Variety Name</th><th>Total Brands</th><th>Action</th></tr>`;
                
                const varieties = [...new Set(products.map(p => p.name))];
                varieties.forEach(v => {
                    const brandCount = products.filter(p => p.name === v).length;
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold text-primary fs-5">${v}</td>
                            <td><span class="badge bg-secondary">${brandCount} Brands</span></td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="setView('${v}')">Manage Brands</button>
                            </td>
                        </tr>`;
                });
            } else {
                // VIEW 2: Brands within a specific Variety
                header.innerHTML = `
                    <button class="btn btn-sm btn-outline-secondary mb-2" onclick="setView('all')">
                        <i class="bi bi-arrow-left"></i> Back to Varieties
                    </button>
                    <h4 class="text-white">Managing Brands for: <span class="text-info">${currentView}</span></h4>`;
                
                // Updated Table Header to include Bag Price
                thead.innerHTML = `<tr><th>Brand</th><th>Stock (Bags + Loose)</th><th>Pricing</th><th>Actions</th></tr>`;

                const filtered = products.filter(p => p.name === currentView);
                filtered.forEach(p => {
                    // --- NEW CALCULATION LOGIC ---
                    const totalBags = Math.floor(p.quantity / p.bagWeight);
                    const looseKg = (p.quantity % p.bagWeight).toFixed(1);
                    
                    // Check if stock is less than the limit (e.g., 5 bags)
                    const isLow = totalBags < p.minStockBags; 

                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold text-info">${p.brand}</td>
                            <td>
                                <span class="badge ${isLow ? 'bg-danger' : 'bg-success'} fs-6">
                                    ${totalBags} Bags + ${looseKg} kg
                                </span>
                                ${isLow ? '<br><small class="text-danger fw-bold">⚠️ RESTOCK: Below 5 Bags!</small>' : ''}
                            </td>
                            <td>
                                <div class="small text-white">Retail: ₹${p.price}/kg</div>
                                <div class="fw-bold text-warning">Wholesale: ₹${p.bagPrice} / ${p.bagWeight}kg Bag</div>
                            </td>
                            <td>
                         
                         <button class="btn btn-sm btn-outline-warning me-2" 
                                 onclick="openEditModal(${p.id})">
                             <i class="bi bi-pencil"></i>
                         </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id}, '${p.brand}')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </td>
                        </tr>`;
                });
            }
        }

function setView(view) {
    currentView = view;
    loadInventory(); // Re-fetch and re-render
}

async function deleteProduct(id, brandName) {
    if (confirm(`Are you sure you want to stop selling ${brandName}? This will remove it from the database.`)) {
        const response = await fetch(`/delete-product/${id}`, { method: 'DELETE' });
        if (response.ok) {
            loadInventory();
        } else {
            alert("Delete failed. Check server connection.");
        }
    }
}

async function loadSuppliersForModal() {
    const response = await fetch('/view-suppliers');
    const suppliers = await response.json();
    const select = document.getElementById('editSupplier');
    
    select.innerHTML = '<option value="">Select Supplier...</option>';
    suppliers.forEach(s => {
        select.innerHTML += `<option value="${s.id}">${s.name}</option>`;
    });
}

// Call this when the page loads
window.onload = () => {
    loadInventory();
    loadSuppliersForModal(); 
};

function openEditModal(id) {
    const p = allProducts.find(item => item.id === id);
    if (!p) return alert("Product not found!");

    // Set standard fields
    document.getElementById('editId').value = p.id;
    document.getElementById('editBrand').value = p.brand;
    document.getElementById('editPrice').value = p.price;
    document.getElementById('editBagPrice').value = p.bagPrice;
    document.getElementById('editBagWeight').value = p.bagWeight;
    
    // Set the buying price - checking for nulls
    const buyingPriceInput = document.getElementById('editBuyingPrice');
    if(buyingPriceInput) {
        buyingPriceInput.value = p.buyingPrice || 0;
    }

    // Set Supplier dropdown
    const supplierSelect = document.getElementById('editSupplier');
    if(supplierSelect) {
        supplierSelect.value = p.supplierId || "";
    }

    document.getElementById('editAddStock').value = 0;

    const modalElement = document.getElementById('editModal');
    const modalInstance = bootstrap.Modal.getOrCreateInstance(modalElement);
    modalInstance.show();
}

        // 3. UPDATE STOCK FUNCTION
        // 1. Function to open the modal and fill it with current data
function promptUpdateStock(id, brand) {
    // Find the product from your allProducts list to pre-fill the boxes
    const p = allProducts.find(item => item.id === id);
    
    document.getElementById('editId').value = id;
    document.getElementById('editBrand').value = p.brand;
    document.getElementById('editPrice').value = p.price;
    document.getElementById('editBagPrice').value = p.bagPrice;

    document.getElementById('editAddStock').value = 0; // Reset add stock to 0

    // Open the Bootstrap Modal
    const myModal = new bootstrap.Modal(document.getElementById('editModal'));

}
        
function renderLowStockDashboard(products) {
    const container = document.getElementById('stock-alert-container');
    const lowStockItems = products.filter(p => (p.quantity / p.bagWeight) < p.minStockBags);

    if (lowStockItems.length === 0) {
        container.innerHTML = ''; 
        return;
    }

    let alertHtml = lowStockItems.map(p => {
        const bagsLeft = Math.floor(p.quantity / p.bagWeight);
        // 🟢 Added onclick to switch view and open modal automatically
        return `
            <div class="col-md-3 mb-2" style="cursor: pointer;" onclick="quickManageBrand('${p.name}', ${p.id})">
                <div class="p-2 border border-danger border-opacity-50 rounded glass-card bg-danger bg-opacity-10 text-center">
                    <div class="fw-bold text-white small">${p.brand}</div>
                    <div class="badge bg-danger mt-1">${bagsLeft} Bags Left</div>
                </div>
            </div>`;
    }).join('');

    container.innerHTML = `
        <div class="glass-card p-3 mb-4 border-start border-4 border-danger shadow">
            <div class="d-flex align-items-center mb-3">
                <i class="bi bi-megaphone-fill text-danger me-2"></i>
                <h6 class="text-white m-0 fw-bold text-uppercase">Supplier Order List (Click to Restock)</h6>
            </div>
            <div class="row g-2">${alertHtml}</div>
        </div>
    `;
}

    // Build the grid of alerts

    container.innerHTML = `

            <div class="d-flex align-items-center mb-3">
                <i class="bi bi- megaphone-fill text-danger me-2"></i>
                <h6 class="text-white m-0 fw-bold text-uppercase">Supplier Order List</h6>
            </div>
            <div class="row g-2">
                ${alertHtml}
            </div>
        </div>
    `;

// 2. Function to send all data at once to your Java Backend
// Add this inside your <script> to update the hint text as he types
document.getElementById('editAddStock').addEventListener('input', function() {
    const bags = parseFloat(this.value) || 0;
    const weight = parseInt(document.getElementById('editBagWeight').value) || 26;
    document.getElementById('bagConversionHint').innerText = `${(bags * weight).toFixed(1)} kg will be added`;
});


function downloadStockReport() {
    if (!allProducts || allProducts.length === 0) {
        return alert("No stock data available to download!");
    }

    // 🟢 1. Create CSV Header
    let csvContent = "data:text/csv;charset=utf-8,";
    csvContent += "Variety,Brand,Total Bags,Loose KG,Total KG,Retail Price,Wholesale Price\r\n";

    // 🟢 2. Process each product brand-wise
    allProducts.forEach(p => {
        const variety = p.name;
        const brand = p.brand;
        const weight = p.bagWeight || 26;
        
        // Calculate bags and loose kg for the report
        const totalBags = Math.floor(p.quantity / weight);
        const looseKg = (p.quantity % weight).toFixed(1);
        const totalKg = p.quantity.toFixed(1);
        
        const retail = p.price;
        const wholesale = p.bagPrice;

        // Add row to CSV
        csvContent += `"${variety}","${brand}",${totalBags},${looseKg},${totalKg},${retail},${wholesale}\r\n`;
    });

    // 🟢 3. Trigger Download
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    const today = new Date().toISOString().split('T')[0];
    
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `Ethirajan_Mandi_Stock_Report_${today}.csv`);
    document.body.appendChild(link);
    
    link.click();
    document.body.removeChild(link);
}

async function saveFullUpdate() {
    const id = document.getElementById('editId').value;
    const bagWeight = parseInt(document.getElementById('editBagWeight').value) || 26;
    const bagsEntered = parseFloat(document.getElementById('editAddStock').value) || 0;

    // 🟢 CONVERT BAGS TO KG BEFORE SENDING
    const addedQtyKg = bagsEntered * bagWeight;
    
    const updateData = {
        brand: document.getElementById('editBrand').value,
        price: parseFloat(document.getElementById('editPrice').value),
        bagPrice: parseFloat(document.getElementById('editBagPrice').value),
        bagWeight: bagWeight,
        buyingPrice: parseFloat(document.getElementById('editBuyingPrice').value) || 0, 
        addedQty: addedQtyKg, 
        supplierId: document.getElementById('editSupplier').value 
    };

    const response = await fetch(`/update-product-full/${id}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(updateData)
    });

    if (response.ok) {
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
        alert(`Stock Updated: ${bagsEntered} bags added!`);
        location.reload(); 
    }
}

        
        function getStockDisplay(totalKg, bagWeight) {
            const bags = Math.floor(totalKg / bagWeight);
            const loose = (totalKg % bagWeight).toFixed(2);
            
            return `
                <div class="fw-bold text-success">${bags} Full Bags</div>
                <div class="text-muted small">+ ${loose} kg loose</div>
                <div class="badge bg-secondary mt-1">${totalKg} kg Total</div>
            `;
        }
        
        
        

        // In your loop:
        // <td>${getStockDisplay(p.quantity, p.bagWeight)}</td>
        async function updateStock() {
            const id = document.getElementById('productSelect').value;
            const qty = document.getElementById('addQty').value;

            if (!id || !qty) return alert("Please select item and quantity");

            try {
                // We use a negative value for the checkout endpoint to ADD stock, 
                // but it's better to create a proper restock endpoint later.
                // For now, let's assume we have an endpoint: /restock/{id}/{qty}
                const response = await fetch(`http://localhost:8081/restock/${id}/${qty}`, { method: 'POST' });
                
                if (response.ok) {
                    alert("Stock Updated Successfully!");
                    document.getElementById('addQty').value = '';
                    loadInventory();
                }
            } catch (err) { alert("Update failed."); }
        }

        loadInventory();
    </script>
