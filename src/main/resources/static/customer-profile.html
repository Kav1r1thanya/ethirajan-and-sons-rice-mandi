<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    
    <script src="security.js"></script>
    <title>Customer Profile | NomNom Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        
    body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
    
    .glass-card { 
        background: #1e293b !important; 
        border: 1px solid rgba(255,255,255,0.1); 
        border-radius: 15px; 
    }

    /* 🟢 FORCE TRANSACTION TABLE DARK */
    .history-table { 
        background-color: #1e293b !important; 
        color: #ffffff !important; 
        border: 1px solid #334155 !important;
        border-radius: 10px;
        overflow: hidden;
    }

    .history-table thead tr {
        background-color: #0f172a !important;
    }

    .history-table thead th {
        color: #60a5fa !important;
        border-bottom: 2px solid #334155 !important;
    }

    .history-table tbody tr {
        background-color: #1e293b !important; /* Fixes the white row in your screenshot */
    }

    .history-table td { 
        color: #ffffff !important; 
        border-bottom: 1px solid #334155 !important;
        background-color: transparent !important;
    }

    /* Fix address and label visibility */
    #prof-address, .text-muted {
        color: #94a3b8 !important;
    }
    
    strong { color: #cbd5e1; }


    </style>
</head>
<body onload="loadProfile()">

<div class="container py-5">
    
    <div class="d-flex justify-content-between align-items-center mb-4">
    <button onclick="smartBack()" class="btn btn-outline-primary px-4">
        <i class="bi bi-arrow-left me-2"></i>Back
    </button>

    <a href="customers.html" class="btn btn-primary shadow-sm">
        <i class="bi bi-database-fill me-2"></i>Customer Database
    </a>
</div>

    <div class="row">
        <div class="col-md-4">
            <div class="glass-card p-4 text-center">
                <div class="display-4 text-primary mb-2"><i class="bi bi-person-circle"></i></div>
                <h2 id="prof-name">Loading...</h2>
                <p id="prof-id" class="badge bg-primary fs-6">NOM-XXXX</p>
                <hr class="border-secondary">
                <div class="text-start">
                    <p><strong><i class="bi bi-telephone"></i> Phone:</strong> <span id="prof-phone"></span></p>
                    <p><strong><i class="bi bi-geo-alt"></i> Address:</strong> <br><span id="prof-address" class="text-muted small"></span></p>
                </div>
                <div class="d-flex justify-content-center gap-2 mt-3">
    <button class="btn btn-sm btn-outline-warning" onclick="editCustomer()">
        <i class="bi bi-pencil"></i> Edit Details
    </button>
    <button class="btn btn-sm btn-outline-danger" onclick="clearHistory()">
        <i class="bi bi-trash"></i> Clear History
    </button>
</div>
                <div class="mt-4 p-3 bg-dark rounded border border-danger">
                    <small class="text-muted">CURRENT BALANCE</small>
                    <div id="prof-debt" class="text-danger fw-bold fs-3">₹0.00</div>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="glass-card p-4">
                <h4 class="mb-4">Transaction History</h4>
                <table class="table history-table align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>DATE</th>
                            <th>TYPE</th>
                            <th>DESCRIPTION</th>
                            <th>AMOUNT</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    
async function loadProfile() {
    try {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        if (!id) return;
        
        const res = await fetch(`http://localhost:8081/customer-history/${id}`); // Added semicolon
        if (!res.ok) throw new Error("Server returned " + res.status); // Add this safety check
        const data = await res.json();

        // Safety: If your Java returns {customer: {...}, sales: [...]}, we use data.customer
        // If it returns just the customer object, we use data.
        const c = data.customer || data;
        const sales = data.sales || [];

        // 1. Fill the Debt Box
        document.getElementById('prof-debt').innerText = "₹" + (c.debt || 0);

        // 2. Fill Sidebar
        document.getElementById('prof-name').innerText = c.name || "Unknown";
        document.getElementById('prof-id').innerText = "NOM-" + (1000 + parseInt(c.id));
        document.getElementById('prof-phone').innerText = c.phone || "No Phone";
        document.getElementById('prof-address').innerText = c.address || "No address provided";

        // 3. Fill Table
        const tbody = document.getElementById('history-tbody');
        tbody.innerHTML = ""; // Clear the loading state

        if (sales.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="text-center p-4 text-muted">No transactions found</td></tr>';
        } else {
            sales.forEach(sale => {
                const isActuallyDebt = (sale.isDebt === true || sale.debt === true);
                const typeBadge = isActuallyDebt 
                    ? '<span class="badge bg-danger">DEBT</span>' 
                    : '<span class="badge bg-success">PAID</span>';
                const displayDate = sale.date 
                    ? new Date(sale.date).toLocaleDateString('en-GB') 
                    : "N/A";

                tbody.innerHTML += `
                    <tr>
                        <td>${displayDate}</td>
                        <td>${typeBadge}</td>
                        <td>${sale.itemsSummary}</td>
                        <td class="fw-bold">₹${sale.totalAmount}</td>
                    </tr>
                `;
            });
        }
    } catch (err) {
        console.error("Profile Load Error:", err);
        document.getElementById('prof-name').innerText = "Error Loading Data";
    }
}
    async function editCustomer() {
        const newName = prompt("Enter new name:", document.getElementById('prof-name').innerText);
        const newPhone = prompt("Enter new phone:", document.getElementById('prof-phone').innerText);
        const id = new URLSearchParams(window.location.search).get('id');

        if (newName && newPhone) {
            await fetch(`http://localhost:8081/update-customer/${id}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name: newName, phone: newPhone })
            });
            location.reload();
        }
    }
    
    
    function smartBack() {
        if (document.referrer.includes('customers.html')) {
            window.location.href = 'customers.html';
        } else {
            window.location.href = 'debt.html';
        }
    }

    async function clearHistory() {
        if (confirm("Are you sure? This will delete all purchase records for this customer!")) {
            const id = new URLSearchParams(window.location.search).get('id');
            await fetch(`http://localhost:8081/clear-history/${id}`, { method: 'DELETE' });
            location.reload();
        }
    }
</script>

</body>
</html>
